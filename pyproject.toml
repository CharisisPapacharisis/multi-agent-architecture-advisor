[project]
name = "multi-agent-project"
version = "0.1.0"
description = "Local multi-agent assistant for evidence-based cloud architecture reviews"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "ddgs>=9.16.0",
    "fastapi>=0.141.1",
    "google-adk>=2.11.0",
    "httpx>=0.28.1",
    "litellm>=1.105.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
